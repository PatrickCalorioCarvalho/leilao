<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Promissórias</title>
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box}
body{margin:0;font:12px/1.35 Georgia,serif;color:#000;background:#ddd}
.folha{width:210mm;height:297mm;background:#fff;margin:8px auto;display:flex;flex-direction:column;justify-content:space-evenly;page-break-after:always;overflow:hidden}
/* cada via é uma caixa (como a promissória original): faixa lateral da entidade + corpo */
.via{height:136mm;margin:0 10mm;border:1px solid #000;display:flex;position:relative;overflow:hidden}
.faixa{flex:0 0 22mm;border-right:1px solid #000;display:flex;padding:1mm}.faixa img{width:100%;height:100%;object-fit:contain}
.corpo{flex:1;min-width:0;padding:5mm 8mm 5mm 6mm;display:flex;flex-direction:column}
.via .tag{position:absolute;right:3mm;top:2mm;font:bold 9px Arial;text-transform:uppercase;border:1px solid #000;padding:1px 6px;background:#fff}
.ent{display:flex;gap:10px;align-items:center;font-size:10.5px;line-height:1.25;margin-bottom:4px}.ent img{max-height:46px;max-width:130px}
.cab{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:13px;margin:0 0 9px;padding-top:3px}
.cab span:nth-child(even){text-align:right}
.txt{text-align:justify;font-size:13px;line-height:1.5;margin:0 0 7px}
table{width:100%;border-collapse:collapse;margin:2px 0 7px;font-size:11.5px}
th,td{border-bottom:1px solid #999;padding:1px 4px;text-align:left}
td.n,th.n{text-align:right}
.mini .txt{font-size:11.5px;line-height:1.35;margin-bottom:4px}.mini table{font-size:9.5px}.mini th,.mini td{padding:0 4px}.mini .cab{margin-bottom:4px}
.dados{font-size:12.5px;line-height:1.55;margin:0 0 6px}
.assin{margin-top:auto;padding-top:6px}
.assin div{width:75%;border-top:1px solid #000;padding-top:2px;font-size:11.5px}
.bar{position:sticky;top:0;background:#333;color:#fff;padding:8px;text-align:center}
.bar button{font-size:16px;padding:6px 16px}
@media print{.bar{display:none}body{background:#fff}.folha{margin:0}}
</style>
</head>
<body>
<div class="bar"><button onclick="print()">🖨 Imprimir</button> <span id="info"></span></div>
<div id="out"></div>
<script>
const brl = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const U = ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove', 'dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
const D = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
const C = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];
function ate999(n) {
  if (n === 100) return 'cem';
  const c = Math.floor(n / 100), r = n % 100, p = [];
  if (c) p.push(C[c]);
  if (r) p.push(r < 20 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? ' e ' + U[r % 10] : ''));
  return p.join(' e ');
}
function inteiro(n) {
  if (n === 0) return 'zero';
  const mi = Math.floor(n / 1e6), mil = Math.floor((n % 1e6) / 1000), r = n % 1000, p = [];
  if (mi) p.push(ate999(mi) + (mi === 1 ? ' milhão' : ' milhões'));
  if (mil) p.push(mil === 1 ? 'mil' : ate999(mil) + ' mil');
  if (r) p.push(ate999(r));
  // "e" antes do último bloco quando ele é < 100 ou múltiplo de 100
  if (p.length > 1 && (r && (r < 100 || r % 100 === 0) || (!r && mil && (mil < 100 || mil % 100 === 0)))) return p.slice(0, -1).join(', ') + ' e ' + p.at(-1);
  return p.join(', ');
}
function extenso(v) {
  const c = Math.round(v * 100), r = Math.floor(c / 100), ct = c % 100, out = [];
  if (r) out.push(inteiro(r) + (r === 1 ? ' real' : (r % 1e6 === 0 ? ' de reais' : ' reais')));
  if (ct) out.push(inteiro(ct) + (ct === 1 ? ' centavo' : ' centavos'));
  return out.join(' e ') || 'zero reais';
}
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const dataExt = iso => { const [a, m, d] = iso.split('-'); return `${new Date(+a, +m - 1, +d).toLocaleDateString('pt-BR', { weekday: 'long' })}, ${+d} de ${MESES[+m - 1]} de ${a}`; };

// texto da promissória: vem do banco (Leilões > Configuração); vazio = este padrão. **negrito**, {variável}, quebra de linha
const padrao = L => 'Até {vencimento} pagarei por esta única via de **NOTA PROMISSÓRIA** a {beneficiario}' + (L.cnpj ? ' CNPJ: {cnpj}' : '') + ' ou à sua ordem a quantia de ### {valor_extenso} ### em moeda corrente deste país.';
function textoPromissoria(L, vars) {
  return esc(L.texto_promissoria || padrao(L)).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/\{(\w+)\}/g, (m, k) => (k in vars ? `<b>${esc(vars[k])}</b>` : m)).replace(/\n/g, '<br>');
}

function via(L, it, nome) {
  const total = it.lotes.reduce((s, l) => s + l.valor_final, 0), p = it.pessoa;
  const venc = L.vencimento ? dataExt(L.vencimento) : '____ de ______________ de ________';
  const emis = L.data ? dataExt(L.data) : '____ de ______________ de ________';
  const lotes = it.lotes.map(l => l.rotulo).join(', ');
  const vars = { vencimento: venc, emissao: emis, beneficiario: L.beneficiario || '________________________________', cnpj: L.cnpj || '',
    valor: brl(total), valor_extenso: extenso(total), leilao: L.nome, cidade: L.cidade || '______________', comprador: p.nome, cpf: p.cpf || '',
    lote: lotes, produto: it.lotes.map(l => l.descricao).join('; ') };
  const logo = L.tem_logo ? `<img class="logo" src="/api/logo?leilao=${L.id}">` : '';
  return `<div class="via${it.lotes.length > 7 ? ' mini' : ''}"><span class="tag">${nome}</span><div class="corpo">
  ${logo || L.endereco_entidade || L.telefone_entidade ? `<div class="ent">${logo}<div><b>${esc(L.beneficiario)}</b>${L.cnpj ? '<br>CNPJ ' + esc(L.cnpj) : ''}${L.endereco_entidade || L.telefone_entidade ? '<br>' + esc(L.endereco_entidade) + (L.endereco_entidade && L.telefone_entidade ? ' · ' : '') + esc(L.telefone_entidade) : ''}</div></div>` : ''}
  <div class="cab"><span>Lote Nº: <b>${esc(lotes)}</b></span><span>Vencimento: <b>${L.vencimento ? L.vencimento.split('-').reverse().join('/') : '___/___/______'}</b></span>
    <span>${esc(L.nome)}</span><span>Valor: <b>${brl(total)}</b></span></div>
  <p class="txt">${textoPromissoria(L, vars)}</p>
  <table><tr><th>Referente à</th><th>Descrição</th><th class="n">Valor</th></tr>
  ${it.lotes.map(l => `<tr><td>Lote ${esc(l.rotulo)}</td><td>${esc(l.descricao)}${l.condicao ? ' (' + l.condicao + ')' : ''}${l.animal_num ? ' #' + esc(l.animal_num) : ''}${l.doado ? ' <b>[DOADO]</b>' : ''}</td><td class="n">${brl(l.valor_final)}</td></tr>`).join('')}</table>
  <div class="dados"><b>Arrematador:</b> ${esc(p.nome)} &nbsp;–&nbsp; <b>RG:</b> ${esc(p.rg) || '______________'}<br>
  <b>CPF:</b> ${esc(p.cpf) || '________________'} &nbsp;&nbsp; <b>Telefone:</b> ${esc(p.telefone) || '______________'}<br>
  <b>Endereço:</b> ${esc(p.endereco) || '______________________________________'}<br>
  ${esc(L.cidade || '______________')}, ${emis}.</div>
  <div class="assin"><div>${esc(p.nome)} &nbsp;–&nbsp; RG: ${esc(p.rg)}</div></div></div></div>`;
}
// logo "em pé" (faixa vertical, como o Lar.jpg do sistema antigo) vira a faixa lateral da caixa; logo normal fica no topo
function logoOk(img) {
  const v = img.closest('.via');
  if (!v || !img.naturalWidth || img.naturalHeight < img.naturalWidth * 1.5) return;
  const f = document.createElement('div'); f.className = 'faixa'; img.className = ''; f.append(img);
  v.prepend(f); v.querySelector('.ent')?.remove();
}
const carregada = img => new Promise(r => { const f = () => { logoOk(img); r(); }; img.complete ? f() : (img.addEventListener('load', f), img.addEventListener('error', r)); });
(async () => {
  const r = await (await fetch('/api/promissoria' + location.search)).json();
  $info = document.getElementById('info'); $info.textContent = `${r.itens.length} promissória(s) — ${r.itens.length} folha(s) A4`;
  document.getElementById('out').innerHTML = r.itens.map(it =>
    `<div class="folha">${via(r.leilao, it, 'Via do comprador')}${via(r.leilao, it, 'Via da mesa')}</div>`).join('') || '<p style="padding:20px">Nenhum arremate.</p>';
  await Promise.all([...document.querySelectorAll('img.logo')].map(carregada));
  if (new URLSearchParams(location.search).get('auto') && r.itens.length) setTimeout(() => print(), 300);
})();
</script>
</body>
</html>
