# Sobe MySQL + sistema. Só precisa do Docker; offline depois da primeira instalação das imagens.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: leilao_root
      MYSQL_DATABASE: leilao
      MYSQL_USER: leilao
      MYSQL_PASSWORD: leilao
      TZ: America/Sao_Paulo
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports: ["3306:3306"]            # para rodar INSERTs manuais (HeidiSQL/Workbench/DBeaver)
    volumes:
      - ./local/mysql:/var/lib/mysql        # arquivos do banco ficam NESTA pasta
      - ./local/banco:/docker-entrypoint-initdb.d:ro   # local/banco/leilao.sql é carregado sozinho quando local/mysql/ está vazio
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pleilao_root"]
      interval: 3s
      retries: 40
  app:
    build: ./app                           # PC de desenvolvimento: constrói a partir do código
    image: leilao-app:latest              # PC do leilão: o Leilao.bat (Iniciar) baixa ${IMAGEM} do GitHub (ghcr.io) com este nome
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_HOST: db
      TZ: America/Sao_Paulo
      HOST_IP: ${HOST_IP:-}                 # preenchido pelo Leilao.bat (Iniciar) (para o QR code)
      BACKUP_LOCAL: /backups/local
      BACKUP_NUVEM: /backups/nuvem
      NUVEM_OK: ${NUVEM_OK:-}               # "sim" quando NUVEM_DIR foi configurada (ver Leilao.bat (Configurar))
      # Backblaze B2 (opcional) — ver .env.exemplo e docs/backup-e-nuvem.md
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APP_KEY: ${B2_APP_KEY:-}
      B2_BUCKET_ID: ${B2_BUCKET_ID:-}
      B2_PASTA: ${B2_PASTA:-leilao}
      BACKUP_SENHA: ${BACKUP_SENHA:-}
    ports: ["3000:3000"]
    volumes:
      - ./logo:/app/logo:ro                 # coloque aqui logo.png (opcional)
      - ./local/banco/finais:/backups/local       # backups/relatórios finais: SEMPRE gravados aqui
      - ${NUVEM_DIR:-./local/banco/nuvem}:/backups/nuvem   # OPCIONAL: pasta do OneDrive/Google Drive deste PC
